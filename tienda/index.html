<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda esotérica</title>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--card:rgba(255,255,255,.06);--line:rgba(198,134,221,.28);--txt:#f4ecff;--mut:#cdbde6;--acc:#C686DD}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% -10%,#4B1F6F 0%,#2A123F 36%,#121F50 78%,#2B0128 118%) fixed;color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Marcellus',serif;font-weight:400;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
header{text-align:center;margin-bottom:22px}
header h1{font-size:2.2rem}header p{color:var(--mut);margin:.4rem 0 0}
.cats{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.cats button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:99px;padding:8px 16px;cursor:pointer;font:inherit;font-size:.9rem}
.cats button.on{background:#7b337e;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.pimg{aspect-ratio:1/1;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:2.4rem;color:var(--mut);position:relative}
.pimg img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:10px;left:10px;background:#b8283a;color:#fff;font-size:.72rem;padding:3px 9px;border-radius:99px}
.badge.f{left:auto;right:10px;background:rgba(0,0,0,.6);color:#fbbf24}
.pb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb h3{font-size:1.1rem}.pb p{margin:0;color:var(--mut);font-size:.86rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:700;font-size:1.1rem;margin-top:auto}.price s{color:var(--mut);font-weight:400;font-size:.88rem;margin-left:6px}
.soon{color:var(--mut);font-size:.8rem}
.empty{text-align:center;color:var(--mut);padding:50px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>&#x2726; Tienda esotérica &#x2726;</h1><p>Mazos de tarot, oráculos y accesorios</p></header>
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function () {
  var CAT = { 'mazos-tarot': 'Mazos de tarot', 'mazos-oraculo': 'Mazos oráculo', 'accesorios': 'Accesorios', 'velas-inciensos': 'Velas e inciensos', 'cristales': 'Cristales y piedras', 'libros': 'Libros y guías' };
  var all = [], cur = '';
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return '$' + Number(n).toLocaleString('es-AR'); }
  function render() {
    var present = Object.keys(CAT).filter(function (k) { return all.some(function (p) { return p.category === k; }); });
    document.getElementById('cats').innerHTML = all.length ? ['<button data-c="" class="' + (cur === '' ? 'on' : '') + '">Todo</button>'].concat(present.map(function (k) {
      return '<button data-c="' + k + '" class="' + (cur === k ? 'on' : '') + '">' + CAT[k] + '</button>'; })).join('') : '';
    var list = all.filter(function (p) { return !cur || p.category === cur; });
    document.getElementById('grid').innerHTML = list.length ? list.map(function (p) {
      return '<div class="pc"><div class="pimg">' + (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="' + esc(p.name) + '" loading="lazy">' : '&#x2726;') +
        (p.stock === 0 ? '<span class="badge">Sin stock</span>' : '') + (p.featured ? '<span class="badge f">&#9733; Destacado</span>' : '') + '</div>' +
        '<div class="pb"><h3>' + esc(p.name) + '</h3>' + (p.description ? '<p>' + esc(p.description) + '</p>' : '') +
        '<div class="price">' + money(p.price) + (p.compare_price ? '<s>' + money(p.compare_price) + '</s>' : '') + '</div>' +
        '<div class="soon">' + (p.stock === 0 ? 'Agotado por ahora' : 'Compra online muy pronto') + '</div></div></div>';
    }).join('') : '<div class="empty" style="grid-column:1/-1">Pronto vas a encontrar acá nuestros productos.</div>';
  }
  document.getElementById('cats').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; cur = b.getAttribute('data-c'); render(); });
  fetch('/api/store-products').then(function (r) { return r.json(); }).then(function (d) { all = d.products || []; render(); }).catch(function () { render(); });
})();
</script>
</body>
</html>
